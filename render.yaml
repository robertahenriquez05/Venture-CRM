# Render Blueprint: one free web service + one free Postgres database.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: venture-crm
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn ventureCRM.wsgi:application
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Sign-in for the deployed site: username "demo", password generated by Render.
      # Find it in the Render dashboard: venture-crm -> Environment -> VENTURE_CRM_DEMO_PASSWORD.
      - key: VENTURE_CRM_DEMO_USERNAME
        value: demo
      - key: VENTURE_CRM_DEMO_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: venture-crm-db
          property: connectionString

databases:
  - name: venture-crm-db
    plan: free
    databaseName: venture_crm
    user: venture_crm
